services:
  - type: web
    name: link-expiry-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: link-expiry-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: link-expiry-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://link-expiry-ui.vercel.app

databases:
  - name: link-expiry-db
    plan: free
    region: oregon
    databaseName: link_expiry
    user: link_expiry_user

# Note: Render offers Redis instances starting from the Starter plan or free trial.
# Alternatively, you can connect an Upstash Redis URL via environment variables.
